name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to be released'
        required: true
      release_type:
        type: choice
        description: 'sdk to publish (prod or dev)'
        required: true
        default: prod
        options:
          - prod
          - dev

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upgrade npm
        run: npm install -g npm@11.5.1

      - name: Validate version and build KMP Core package
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          npm run build:kmp-core
          npm run verify:kmp-core

      - name: Install dependencies
        run: npm ci

      - name: Update package name (prod or dev)
        run: |
          if [ "${{ inputs.release_type }}" = "dev" ]; then
            echo "Updating package name to notifly-js-sdk-dev..."
            node scripts/update_package_name.js notifly-js-sdk-dev
          else
            echo "Updating package name to notifly-js-sdk..."
            node scripts/update_package_name.js notifly-js-sdk
          fi

      - name: Read Changelog
        id: read_changelog
        if: ${{ !endsWith(github.event.inputs.version, 'SNAPSHOT') }}
        uses: mindsers/changelog-reader-action@v2
        with:
          version: ${{ github.event.inputs.version }}

      - name: Build package
        run: npm run build

      - name: Create GitHub Release
        if: steps.read_changelog.outputs.changes
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          body: ${{ steps.read_changelog.outputs.changes }}
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Core and Full SDKs to npm
        run: |
          if [ "${{ endsWith(github.event.inputs.version, 'SNAPSHOT') }}" = "true" ]; then
            npm publish ./build/notifly-core-sdk --provenance --access public --tag snapshot
            npm publish --provenance --access public --tag snapshot
          else
            npm publish ./build/notifly-core-sdk --provenance --access public
            npm publish --provenance --access public
          fi
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
