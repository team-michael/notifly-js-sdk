name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to be released'
        required: true
      release_type:
        type: choice
        description: 'sdk to publish (prod or dev)'
        required: true
        default: prod
        options:
          - prod
          - dev

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upgrade npm
        run: npm install -g npm@11.5.1

      - name: Validate version and build KMP Core package
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          npm run build:kmp-core
          npm run verify:kmp-core

      - name: Install dependencies
        run: npm ci

      - name: Update package name (prod or dev)
        run: |
          if [ "${{ inputs.release_type }}" = "dev" ]; then
            echo "Updating package name to notifly-js-sdk-dev..."
            node scripts/update_package_name.js notifly-js-sdk-dev
          else
            echo "Updating package name to notifly-js-sdk..."
            node scripts/update_package_name.js notifly-js-sdk
          fi

      - name: Read Changelog
        id: read_changelog
        if: ${{ !endsWith(github.event.inputs.version, 'SNAPSHOT') }}
        uses: mindsers/changelog-reader-action@v2
        with:
          version: ${{ github.event.inputs.version }}

      - name: Build package and deploy service worker
        run: |
          npm run build
          npm run deploy:sw
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Create GitHub Release
        if: steps.read_changelog.outputs.changes
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          body: ${{ steps.read_changelog.outputs.changes }}
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Core and Full SDKs to npm
        run: |
          publish_if_missing() {
            package_dir="$1"
            dist_tag="$2"
            package_name="$(node -p "require('./${package_dir}/package.json').name")"
            package_version="$(node -p "require('./${package_dir}/package.json').version")"

            if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
              echo "$package_name@$package_version is already published; skipping."
              return
            fi

            publish_args=(--ignore-scripts --provenance --access public)
            if [[ -n "$dist_tag" ]]; then
              publish_args+=(--tag "$dist_tag")
            fi
            npm publish "$package_dir" "${publish_args[@]}"
          }

          if [ "${{ endsWith(github.event.inputs.version, 'SNAPSHOT') }}" = "true" ]; then
            publish_if_missing "build/notifly-core-sdk" "snapshot"
            publish_if_missing "." "snapshot"
          else
            publish_if_missing "build/notifly-core-sdk" ""
            publish_if_missing "." ""
          fi
