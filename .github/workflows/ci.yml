name: CI
on: push

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 16.16.x
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Build KMP Core package
        run: |
          npm run build:kmp-core
          npm run verify:kmp-core

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Run type check
        run: npm run type-check

      - name: Build distributable
        run: npm run build
