name: CI
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Verify tagged KMP source dependency
        run: ./scripts/test_kmp_source_dependency.sh

      - name: Run Jest tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Run type check
        run: npm run type-check

      - name: Build and verify distributable package
        run: |
          npm run build
          npm run verify:kmp-bundle
          npm run smoke:npm
